# Live end-to-end tests: they call the real public Reactome, UniProt and NCBI services, so they run on a schedule and on demand,
# separately from CI. A failure here can mean the services rate-limited this runner (HTTP 429); re-run it before suspecting the code.
name: Live end-to-end tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Live web end-to-end tests
        run: npm run test:e2e:web:live
      - name: Keep the Playwright results if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-live
          path: test-results/
          retention-days: 7
