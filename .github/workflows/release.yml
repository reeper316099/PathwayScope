# Release: on a version tag (v*), build installers on Linux, Windows and macOS, attach them (plus SHA256SUMS.txt) to a GitHub Release.
# Installers are UNSIGNED. Only official actions/* actions and the preinstalled GitHub CLI are used.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected)"; exit 1
          fi
      - name: Create a draft release (so the three build jobs do not race to create it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "PathwayScope $GITHUB_REF_NAME" --generate-notes

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # upload release assets with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # matches "engines": ">=22.12.0" in package.json
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:electron
      - name: Build installers and upload them to the draft release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # never look for a signing certificate: builds are unsigned

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Attach SHA256SUMS.txt and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --dir assets --pattern '*.exe' --pattern '*.dmg' --pattern '*.AppImage' --pattern '*.deb'
          cd assets
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
