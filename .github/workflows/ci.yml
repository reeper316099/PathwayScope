# CI: lint, unit tests, web build and the web end-to-end tests on every pull request and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and format check
        run: |
          npm run lint
          npx prettier --check .
      - name: Unit tests
        run: npm test
      - name: Web build
        run: npm run build:web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Only the @hermetic tests run here: they need no live data (the release-info call is answered from a saved fixture).
      # The tests that call the live Reactome/UniProt/NCBI services are NOT run in CI (run them by hand: npm run test:e2e:web:live),
      # because GitHub's shared runner IPs are often rate-limited by Reactome's CDN (HTTP 429 -> a CORS error in the browser).
      - name: Web end-to-end tests (no live services)
        run: npm run test:e2e:web:hermetic
      - name: Keep the Playwright results if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
