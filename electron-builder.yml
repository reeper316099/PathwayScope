# electron-builder config. All installers are UNSIGNED (see README "Unsigned apps").
# Locally verified: macOS arm64 only. Windows, Linux and macOS x64 builds are verified only by CI (see README).
appId: com.reeper316099.pathwayscope
productName: PathwayScope
copyright: Copyright © 2026 reeper316099
directories:
  output: release
  buildResources: build # icon.icns / icon.ico / icon.png are picked up from here
files:
  - dist/**
  - electron/**
  - package.json
asar: true
afterPack: scripts/after-pack.cjs
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: reeper316099
  repo: PathwayScope
  releaseType: draft # the release workflow publishes it after all builds and checksums are attached

win:
  target:
    - { target: nsis, arch: [x64] }
    - { target: portable, arch: [x64] }
nsis:
  artifactName: ${productName}-Setup-${version}-${os}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

portable:
  artifactName: ${productName}-Portable-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.education
  identity: null # electron-builder does no signing; scripts/after-pack.cjs applies a valid ad-hoc signature (no Developer ID, not notarized)
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - { target: dmg, arch: [arm64, x64] }

linux:
  category: Education
  maintainer: reeper316099 <coding31609@gmail.com>
  target:
    - { target: AppImage, arch: [x64] }
    - { target: deb, arch: [x64] }
